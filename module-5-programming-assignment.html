console.log("The binary and binary search trees");

function BinarySearchTree() {
  function Node(key) {
    this.key = key;
    this.left = null;
    this.right = null
  }

  // the root node
  var root = null;

  // helper functions
  function insertNode(node, newNode) {
    if (newNode.key < node.key) {
      // go to left
      if (node.left === null) {
        // no left node yet so assign
        node.left = newNode;
      }
      else {
        // move down tree and repeat
        insertNode(node.left, newNode);
      }
    }
    else {
      // go to right
      if (node.right === null) {
        // no right node yet so assign
        node.right = newNode;
      }
      else {
        // move down tree and repeat
        insertNode(node.right, newNode);
      }
    }
  }

  this.insert = function(key) {
    // insert new key in the tree
    var newNode = new Node(key);
    if (root === null) {
      // no nodes yet
      root = newNode;
    } else {
      // find insert location through insertNode
      insertNode(root, newNode);
  }
};

// REMOVE //
// HAS 3 CASES
// 1: leaf node = delete
// 2: one child = replace node with child
// 3: two children = replace key with in order successor
//  min of R subtree, then delete successor from right

function removeNode(node, key) {
  if (node === null) {
    return null;
  }
  if (key < node.key) {
    node.left = removeNode(node.left, key);
    return node;
  }else if (key > node.key) {
    node.right = removeNode(node.right, key);
    return node;
  } else {
    // case 1 leaf
    if (node.left === null && node.right === null) {
      node = null;
      return node;
    }
    //case 2.1 right child only
    if (node.left === null) {
      node = node.right;
      return node;
    }
    //case 2.2 left child only
    if (node.right === null) {
      node = node.left;
      return node;
    }
    //case 3 two children
    var aux = minNode(node.right);//find scs in order
    node.key = aux.key; //copy scs
    node.right = removeNode(node.right, aux.key);//delete scs
    return node;
  }
}

function Graph() {
  var vertices = [];
  var adjList = {};

    adjList[v] = []; //empty neighbor list
  };

    adjList[v].push(w);
    adjList[w].push(v);
  };

    var s = '';
    for (var i = 0; i < vertices.length; i++) {

function minDistance(dist, visited) {
  var min = Infinity;
  var minIndex = -1;
  for (var v = 0; v < dist.length; v++) {
    if (!visited[v] && dist[v] <= min) {
      min - dist[v];
      minIndex = v;
    }
  }
  return minIndex;
}


function dijkstra(graph, src) {
  var length = graph.length;
  var dist = [];
  var visited = [];

  for (var i = 0; i < length; i++) {
    dist[i] = Infinity;
    visited[i] = false;
  }
  dist[src] = 0;
  for (var v = 0; v < length; v++) {
    var u = minDistance(dist, visited);
    for (var v = 0; v < length; v++) {
    if (!visited[v] && graph[u][v] !== 0 && dist[u] !== Infinity
      && dist[u] + graph[u][v] < dist[v]) {
        dist[v] = dist[u] + graph[u][v];
      }
    }
  }
  return dist;
}
