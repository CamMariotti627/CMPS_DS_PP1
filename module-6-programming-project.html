// 2. Complete the createNonSortedRandomArray(size) below by returning an
//    ArrayList with the numbers 1, 2, ..., size in random order.
//    NOTE: there are multiple ways to achieve this.

function createNonSortedRandomArray(size) {
  var nums = [];
  for (var i = 1; i<= size; i++) {
    nums.push(i);
  }
// step 2: fisher yates shuffle
  for (var i = nums.length -1; i > 0; i--) {
    var randomIndex = Math.floor(Math.random() * (i + 1)); 
  //pick index 0... i, swap nums[i] and nums[randomIndex]
  var temp = nums[i];
  nums[i] = nums[randomIndex];
  nums[randomIndex] = temp;
  }
  var list = new ArrayList();
  for (var i = 0; i < nums.length; i++) {
    list.insert(nums[i]);
  }

  return list;
}

// 3. Implement the Quick Sort algorithm and test your code with the function
//    you wrote for (2).

function quickSortHelper(arr) {
  if (arr.length <= 1) {
    return arr;
  }
  var pivotIndex = Math.floor(arr.length / 2);
  var pivot = arr[pivotIndex];

  var left = [];
  var middle = [];
  var right = [];

  for (var i = 0; i < arr.length; i++) {
    if      (arr[i] < pivot) left.push(arr[i]);
    else if (arr[i] > pivot) right.push(arr[i]);
    else    middle.push(arr[i]);
  }
  return quickSortHelper(left).concat(middle, quickSortHelper(right));
}

ArrayList.prototype.quickSort = function() {
  this.array = quickSortHelper(this.array);
};
