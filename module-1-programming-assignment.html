/* Answer: Main difference is when & how type check is performed.  Static typing, variable type is determined at compile time, & must be declared/inferred before program runs & can't change during execution.
characteristics:
-earlier error detection
-better run time performance b/c vars are declared already 
-more strict & binds variables to specific type, ensuring type safety
- better for large scale applicatoins where peak performance is necessary. (example, aerospace, medical software)
- software examples: Java, C, C++, Rust

In dynamic typing variable types are determined at runtime, & variables can change during execution. 
characteristics:
- more flexible & therefore faster to code
- can cause failures b/c type errors are caught during execution.
- easier to use, more beginner friendly, variables do not need to be explicitly declared
- Better for web development, scripting, & scientific computing where quick iterations are needed. 
- software examples: Python, JavaScript, Ruby
*/
