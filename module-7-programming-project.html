// 1. Implement factorial using a recursive function and test your code.

function factorial(n) {
  if (n <= 1) return 1;
  return n * factorial(n -1);
}
console.log("Q1 - 0! =", factorial(0)); // 1
console.log("Q1 - 1! =", factorial(1)); // 1
console.log("Q1 - 5! =", factorial(5)); // 120
console.log("Q1 - 10! =", factorial(10)); // 3628800

// 2. Implement a function that returns the complete fibonacci sequence in an
//    array for a given number.

function fibonacci(n) {
  var seq = [];
  if (n < 1) return seq;
  if (n === 1) return [0];
  seq.push(0); seq.push(1);
  for (var i = 2; i < n; i++) seq.push(seq[i-1] + seq[i-2]);
  return seq;
}
console.log("Q2 - fib(1):", fibonacci(1));
console.log("Q2 - fib(5):", fibonacci(5));
console.log("Q2 - fib(10):", fibonacci(10));

// 3. Implement finding the longest common subsequence using dynamic
//    programming. Test your code.

function lcs(strA, strB) {
  var m = strA.length, n = strB.length;
  var dp = [];
  for (var i = 0; i <= m; i++) {
    dp[i] = [];
    for (var j = 0; j <= n ; j++) dp[i][j] = 0;
  }
  for (var i = 1; i <= m; i++) {
    for (var j = 1; j <= n; j++) {
      if (strA[i-1] === strB[j-1]) dp [i][j] = dp[i-1][j-1] + 1;
      else dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  var result = "", i = m, j = n;
  while (i > 0 && j > 0) {
    if (strA[i-1] === strB[j-1]) {result = strA[i-1] + result; i--; j--; }
    else if (dp[i-1][j] > dp[i][j-1]) i--;
    else j--;
  }
  return { length: dp[m][n], subsequence: result };
}
var r1 = lcs("ABCBDAB", "BDCABA");
console.log("Q3 - LCS of ABCBDAB/BDCABA:", r1.subsequence, "(length " + r1.length + ")");
var r2 = lcs("AGGTAB", "GXTXAYB");
console.log("Q3 - LCS of AGGTAB/GXTXAYB:", r2.subsequence, "(length" + r2.length + ")");

// 4. Solve the problem of summing all the numbers in an array using
//    imperative style.

function sumImperative(arr) {
  var total = 0;
  for (var i = 0; i < arr.length; i++) total += arr[i];
  return total;
}
var numbers = [1,2,3,4,5];
console.log("Q4 = Imperative sum:", sumImperative(numbers)); // 15



// 5. Solve the problem of summing all the numbers in an array using
//    functional style.

function sumFunctional(arr) {
  return arr.reduce(function(acc, val) { return acc + val; }, 0);
}
console.log("Q5 - functional sum:", sumFunctional(numbers)); // 15

// 6. Solve problem 14 of Project Euler: https://projecteuler.net/problem=14
//    Note: This may be a bit challenging. Try to get as far as you can.
//          Instead of one million you could use a smaller number for testing.

function longestCollatz(limit) {
  var cache = {};
  cache[1] = 1;
  function chainLength(n) {
    if (cache[n])
    return cache[n];
  cache[n] = 1 + chainLength(n % 2 === 0 ? n / 2 : 3 * n + 1);
  return cache[n];
  }
  var bestStart = 1, bestLength = 1;
  for (var s = 2; s < limit; s++) {
    var len = chainLength(s);
    if (len > bestLength) { bestLength = len; bestStart = s; }
  }
  return { start: bestStart, length: bestLength };
}
var small = longestCollatz(20);
console.log("Q6 - Longest chain under 20: starts at", small.start, "(length " + small.length + ")");
var answer = longestCollatz(1000000);
console.log("Q6 - Longest chain under 1,000,000: starts at", answer.start, "(length " + answer.length + ")");
