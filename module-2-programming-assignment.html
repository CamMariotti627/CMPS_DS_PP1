function Stack() {
var items = [];

this.push = function(element) {
  items.push(element);
}

this.pop = function() {
  return items.pop();
}

this.peek = function() {
  return items[items.length - 1];
}

this.isEmpty = function() {
  return items.length == 0;
}

this.size = function() {
  return items.length;
}

this.clear = function() {
  items = [];
}

this.print = function() {
  console.log(items.toString());
}

}

// 1. Implement the queue data structure described in the book. Instead of

function Queue() {
  var items = [];
  
  this.enqueue = function(element) {
    items.push(element);
  }

  this.dequeue = function() {
    return items.shift();
  }

  this.front = function() {
    return items[0];
  }

  this.isEmpty = function() {
    return items.length ==0;
  }

  this. size = function() {
    return items.length;
  }

  this.clear = function() {
    items = [];
  }

  this.print = function() {
    console.log(items.toString());
  }
}

function QueueElement(element, priority) {   //1st priority
  this.element = element;
  this.priority = priority;
}

function PriorityQueue() {
    var items = [];

  this.enqueue = function(element, priority) {
    var queueElement = new QueueElement(element, priority);
    var added = false;
    for (let i = 0; i<items.length; i++) {
      if (queueElement.priority < items[i].priority) { //2nd priority
        items.splice(i, 0, queueElement);   // 3rd priority
        added = true;
        break; //4th priority
    }
  }
  if (!added) {
    items.push(queueElement); 
  }
}

  this.dequeue = function() {
    return items.shift();
  }

  this.print = function() {
    for (let i = 0; i<items.length; i++) {
      console.log(`${items[i].element} - ${items[i].priority}`);
   }
  };

}

  // ...
  // /while (end of while loop)

  // the person that remains in the queue wins
  // ...

function hotPotato(nameList, num) {
  var queue = new Queue(); //1
  for (let i = 0; i<nameList.length; i++) {   //2
    queue.enqueue(nameList[i]);
  }
  let eliminated = '';
  while (queue.size() > 1) { 
    for (let i = 0; i<num; i++) { //3
      queue.enqueue(queue.dequeue());
    }
    eliminated = queue.dequeue(); //4
    console.log(eliminated + ' is a cold potato!');
  }
  return queue.dequeue(); //5
}

var names = ["John", "Jack", "Camila", "Ingrid", "Carl"];let winner = hotPotato(names, 6); console.log('The Hot Potato is: ' + winner);
