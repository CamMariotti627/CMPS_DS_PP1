  });

};

Set.prototype.subset = function(otherSet) {
  return this.values().every(function(v) {
    return otherSet.has(v);
  });
};

// 8. Implement the hashtable data structure using the prototype.

function HashTable() {
  this.table = [];
}

HashTable.prototype.loseloseHashCode = function (key) {
  var hash = 0;
  for (var i = 0; i < key.length; i++) {
    hash += key.charCodeAt(i);
  }
  return hash % 37;
};


HashTable.prototype.put = function(key, value) {
  var position = this.loseloseHashCode(key);
  if (this.table[position] === undefined) {
    this.table[position] = new LinkedList();
  }
  var current = this.table[position].getHead();
  while(current !== null) {
    if (current.element.key === key) {
      current.element.value = value;
      return;
    }
    current = current.next;
  }
  this.table[position].append(new ValuePair(key, value));
};

HashTable.prototype.remove = function(key) {
  var position = this.loseloseHashcode(key);
  if (this.table[position] !== undefined) {
    var current = this.table[position].getHead();
    var prev = null;
    while (current !== null) {
      if(current.element.key === key) {
        if (prev === null) {
          this.table[position].head = current.next;
        } else {
          prev.next = current.next;
        }
        this.table[position].length--;
        if (this.table[position].length === 0) {
          this.table[position].length = undefined;
        }
        return true;
      }
      prev = current;
      current = current.next;
    }
  }
  return false;
};

function ValuePair(key, value) {
  this.key = key;
  this.value = value;
  this.toString = function() {
    return "[" + this.key + " - " + this.value + "]";
  };
}

function Node(element) {
  this.element = element;
  this.next = null;
}

function LinkedList() {
  this.length = 0;
  this.head = null;
}

LinkedList.prototype.append = function(element) {
  var node = new Node(element);
  if (this.head === null) { this.head = node; }
  else {
    var tmp = this.head;
    while (tmp.next !== null) { tmp = tmp.next; }
    tmp.next = node;
  }
  this.length++;
};

LinkedList.prototype.getHead = function() {
  return this.head;
};

LinkedList.prototype.isEmpty = function() {
  return this.length === 0;
};
