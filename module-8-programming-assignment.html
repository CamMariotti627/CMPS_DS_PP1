// 1. Analyze the complexity of the isPalindrome function below. Make a
//    distinction between best, worst, and average case complexity.

function isPalindrome(str) {
  for (var i = 0; i < str.length/2; i++) {
    if (str[i] !== str[str.length-i-1]) {
      return false;
    }
  }
  return true;
}
console.log("Q1 isPalindrome('racecar'):", isPalindrome('racecar')); // true
console.log("Q1 isPalindrome('hello'):", isPalindrome('hello')); // false
console.log("Q1 isPalindrome('A man, a plan, a canal, Panama'):", isPalindrome('A man, a plan, a canal, Panama')); // true
console.log("Q1 isPalindrome('ab'):" , isPalindrome("ab")); //false 
console.log("Q1 isPalindrome('a'):", isPalindrome("a")); // true

// 2. Write a program that finds the minimum element in a stack in O(1) time
//    complexity. Note that earlier solutions searched through the elements on
//    the stack but that leads to an O(n) solution.
//    NOTE: this question is sometimes asked on interviews.

function MinStack() {
  this.stack = [];
  this.minStack = [];

  this.push = function(val) {
    this.stack.push(val);
    if (this.minStack.length ===0 || val <= this.minStack[this.minStack.length -1]) {
      this.minStack.push(val);
    }
  };

  this.pop = function() {
    var val = this.stack.pop();
    if (val === this.minStack[this.minStack.length -1])
    this.minStack.pop();
  return val;
  };

  this.peek = function() {
    return this.stack[this.stack.length-1]; 
  };

  this.getMin = function() {
    return this.minStack[this.minStack.length -1];
  };

  this.isEmpty = function() {
    return this.stack.length === 0;
  };


}

var ms = new MinStack();
ms.push(5); console.log("push 5 to min:", ms.getMin()); // 5
ms.push(3); console.log("push 3 to min:", ms.getMin()); // 3
ms.push(7); console.log("push 7 to min:", ms.getMin()); // 3
ms.push(2); console.log("push 2 to min:", ms.getMin()); // 2
ms.pop(); console.log("pop 2 from min:", ms.getMin()); // 3
ms.pop(); console.log("pop 7 from min:", ms.getMin()); // 3
ms.pop(); console.log("pop 3 from min:", ms.getMin()); // 5

// 1. Solve Project Euler problem 1 (https://projecteuler.net/problem=1).


function euler1(limit) {
  var sum = 0;
  for (var i = 1; i < limit; i++) {
    if(i % 3 === 0 || i % 5 === 0) sum += i;
  }
  return sum;
}

console.log("Euler #1, below 10:", euler1(10)); // 23
console.log("Euler #1, below 1000:", euler1(1000)); //233168




// 2. Solve Project Euler problem 2 (https://projecteuler.net/problem=2).


function euler2(limit) {
  var sum = 0, prev = 1, curr = 2;
  while (curr <= limit) {
    if (curr % 2 === 0) sum += curr;
    var next = prev + curr;
    prev = curr;
    curr = next;
  }
  return sum;
}
console.log("Euler 2, below 100:  ", euler2(100)); // 44
console.log("Euler 2, below 4000000:  ", euler2(4000000)); // 4613732
