// 1. Implement the ArrayList constructor.
// REMEMBER: //
// - no prototype, all methods inside constructor
//       use: this.methodName = function() {...} 
//       dont use: ArrayList.prototype

function ArrayList() {
  this.array = [];

  this.insert = function(item) {
    this.array.push(item);
  };

  this.toString = function() {
    return this.array.join(", ");
  };

  this.swap = function(index1, index2) {
    var temp           = this.array[index1];
    this.array[index1] = this.array[index2];
    this.array[index2] = temp;
  };

  this.bubbleSort = function() {
    var length = this.array.length;
    for (var i = 0; i < length - 1; i++) {
      for (var j = 0; j < length -1 -i; j++) {
        if (this.array[j] > this.array[j + 1]) {
          this.swap(j, j + 1);
        }
      }
    }
  };


  this.selectionSort = function() {
    var length = this.array.length;
    for (var i = 0; i < length -1; i++) {
      var minIndex = i;
      for (var j = i + 1; j < length; j++) {
        if (this.array[j] < this.array[minIndex]) {
          minIndex = j;
      }
    }
    if (minIndex !== i) {
      this.swap(i, minIndex);
    }
   }
  };

  this. sequentialSearch = function(item) {
    for (var i = 0; i < this.array.length; i++) {
      if (this.array[i] === item) {
        return i;
      }
    }
    return -1;
  }
}


// 2. Implement the createNonSortedArray(size) function from the book.

function createNonSortedArray(Size) {
  var list = new ArrayList();
  for (var i = size; i > 0; i--) {
    list.insert(i);
  } 
return list;
}
